openapi: 3.0.3
info:
  title: Tasks
  version: 1.0.0
  x-docstar-published: true
servers:
  - url: "{{BASE_URL}}"
paths:
  /v1/projects/{projectId}/tasks:
    post:
      operationId: create-task
      x-docstar-published: true
      summary: Create task
      description: |
        Creates a task in a project.

        Body fields: `title` (string, required), `assigneeId` (string, optional user id).
      parameters:
        - name: projectId
          in: path
          required: true
          description: Id of the project.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            example: { title: "Design hero section", assigneeId: "usr_101" }
      responses:
        "201":
          description: Task created.
          content:
            application/json:
              example: { id: "tsk_1", title: "Design hero section", done: false }
